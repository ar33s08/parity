name: ci
on:
  push: {}
  pull_request: {}
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: compile + offline suite + artifact verification
        run: |
          python -m compileall -q parity tools tests
          pip install -q pytest
          python -m pytest tests -q
          python tools/verify_all.py
